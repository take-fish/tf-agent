[project]
name = "tf-agent"
version = "0.1.0"
description = "FishMatrix Agent 服务：大模型智能助手（FastAPI）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pytest.ini_options]
pythonpath = ["."]
